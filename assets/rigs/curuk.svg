<!-- Curuk (Rot) . Damp Cellar . Spoil . melee, a soft shoulder leaned in
     attackSpeed 0.86 > round(20/0.86) = 23 ticks = 1.15 s

     Archetype `punch`: nothing is held, and what it does is lean its own
     weight into what is in front of it.

     `WEAPON curuk [114, 89]` is the front knuckle.

     Silhouette: the bite. A round mass with one large concave bite out of its
     upper right . the only outline in the Cellar that turns inward, and the
     reason it cannot be read as the Moss or the Mildew at board size.

     Mass x 14..92, y 32..118. Materials 2 / fills 4: rot 4E3A2C 8A6A4C
     C3A47C * brass eye F2C46A. Two soft patches, one gleam (upper left), one
     crescent (lower right). -->
