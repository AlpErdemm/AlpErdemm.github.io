<!-- Tarhana · Küf 2 ✦ · Dövüşçü · yakın dövüş
     attackSpeed 1.25 → round(20/1.25) = 16 tick = 0.80 sn

     Kadronun EN HIZLI saldıran gövdesi ve en ucuzu. Sınıf kuralı gereği eli
     boş; sargı, tarhananın kurutulduğu TÜLBENT — gövdesiyle aynı bez.

     SİLUET: Küf'ün tek KAP OLMAYAN gövdesi. Sirke uzun şişe, Turşu kavanoz,
     Küflü Peynir geniş teker — üçü de sert kenarlı; Tarhana boynundan
     bağlanmış yumuşak bir bez torba, ve 40 px'te onu ayıran şey bu yumuşaklık
     ile boy: sınıfın en küçüğü.

     Küf tellini omuzdaki tek koloni taşıyor (`#2E9C8C`, kökenin kendi rengi).
     Fazlası gövdeyi Küflü Peynir'e benzetirdi. -->
