<!-- Leke (Stain) - Bleached Sink - Spoil - melee, a spreading front
     attackSpeed 0.85 -> round(20/0.85) = 24 ticks = 1.20 s

     Archetype `stab`: the arm draws back and drives forward, and what it
     drives is the blot's own edge.

     `WEAPON leke [117, 85]` is the spreading front of the held finger.

     Silhouette: the blot. Seven lobes and no two the same size, so the
     outline is irregular all the way round - which is what tells it from the
     Foam's even froth and from the Grime's flat-topped smear at 53 px. The
     only mass in the Sink that is wider at the shoulders than at the floor
     and still not a wedge.

     Mass x 6..98, y 36..122. Materials 2 / fills 4: stain 5E3226 9A5B45
     C08A6C * brass eye F2C46A. Two drying rings, one gleam (upper left). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -22 212 194"
     class="rig" data-atk="stab" data-unit="leke" style="--dur-atk:1.20s">

  <ellipse class="shadow" cx="52" cy="137" rx="32" ry="6" fill="#2A2114" opacity=".32"/>

  <g class="armB" style="transform-origin:30px 90px">
    <path d="M30 90 L22 96" stroke="#2A2114" stroke-width="12" stroke-linecap="round"/>
    <path d="M30 90 L22 96" stroke="#5E3226" stroke-width="8" stroke-linecap="round"/>
    <circle cx="19" cy="99" r="6.5" fill="#9A5B45" stroke="#2A2114" stroke-width="3"/>
  </g>
  <g class="legB" style="transform-origin:44px 114px">
    <path d="M44 108 L41 124" stroke="#2A2114" stroke-width="14" stroke-linecap="round"/>
    <path d="M44 108 L41 124" stroke="#5E3226" stroke-width="10" stroke-linecap="round"/>
    <path d="M31 124 Q26 129 29 134 L44 134 Q46 128 42 123 Z"
          fill="#9A5B45" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g class="legF" style="transform-origin:62px 114px">
    <path d="M62 108 L65 124" stroke="#2A2114" stroke-width="14" stroke-linecap="round"/>
    <path d="M62 108 L65 124" stroke="#5E3226" stroke-width="10" stroke-linecap="round"/>
    <path d="M63 123 Q60 128 62 134 L77 134 Q79 129 74 124 Z"
          fill="#9A5B45" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g class="body">
    <!-- The blot: fill, crescent, the rings it dried in, a gleam, then the
         ink. Nothing on the outline repeats - every lobe is a different size
         and none of them mirrors another. -->
    <path d="M20 84 Q8 62 28 54 Q32 34 50 48 Q72 34 78 56 Q96 60 86 80 Q98 100 78 108 Q74 124 54 114 Q34 126 28 106 Q10 100 20 84 Z" fill="#9A5B45"/>
    <path d="M86 80 Q98 100 78 108 Q74 124 54 114 L54 108 Q70 114 74 102 Q88 96 80 80 Z" fill="#5E3226"/>
    <path d="M34 74 Q52 66 70 74 M32 96 Q52 88 72 96" fill="none" stroke="#5E3226" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M30 66 Q24 78 30 88" fill="none" stroke="#C08A6C" stroke-width="5" stroke-linecap="round"/>
    <path d="M20 84 Q8 62 28 54 Q32 34 50 48 Q72 34 78 56 Q96 60 86 80 Q98 100 78 108 Q74 124 54 114 Q34 126 28 106 Q10 100 20 84 Z" fill="none" stroke="#2A2114" stroke-width="4" stroke-linejoin="round"/>

    <path d="M34 72 L46 74 M58 74 L70 72" stroke="#2A2114" stroke-width="3.4" stroke-linecap="round"/>
    <ellipse cx="41" cy="84" rx="5.8" ry="6.67" fill="#F2C46A" stroke="#2A2114" stroke-width="2.3"/>
    <ellipse cx="63" cy="84" rx="5.8" ry="6.67" fill="#F2C46A" stroke="#2A2114" stroke-width="2.3"/>
    <ellipse cx="42.4" cy="85" rx="3.16" ry="4.22" fill="#2A2114"/>
    <ellipse cx="64.4" cy="85" rx="3.16" ry="4.22" fill="#2A2114"/>
    <circle cx="40" cy="81.4" r="1.6" fill="#FFFFFF"/>
    <circle cx="62" cy="81.4" r="1.6" fill="#FFFFFF"/>
    <path d="M46 97 Q52 101 58 97" stroke="#2A2114" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path class="crack" d="M38 56 L50 70 L40 84 L52 98 L42 114"
          stroke="#2A2114" stroke-width="3" fill="none" stroke-linejoin="round"/>
  </g>
  <g class="armF" style="transform-origin:78px 90px">
    <path d="M78 90 L94 86" stroke="#2A2114" stroke-width="17" stroke-linecap="round"/>
    <path d="M78 90 L94 86" stroke="#9A5B45" stroke-width="13" stroke-linecap="round"/>
    <!-- A finger of the blot, held out. -->
    <!-- A finger of the blot, held out. Its spreading front is the aim. -->
    <path d="M94 82 Q106 76 117 85 Q106 94 94 90 Z"
          fill="#C08A6C" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g class="fx" style="transform-origin:120px 86px">
    <path d="M120 74 L138 64 M124 86 L142 86 M120 98 L138 108"
          stroke="#9A5B45" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <path d="M120 74 L132 69 M124 86 L136 86 M120 98 L132 103"
          stroke="#C08A6C" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="136" cy="68" r="2.6" fill="#9A5B45"/>
    <circle cx="138" cy="102" r="2.4" fill="#C08A6C"/>
  </g>
</svg>
