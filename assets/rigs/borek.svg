<!-- Börek (Strudel) · Dough 5 · Brawler · melee, bare fists
     attackSpeed 1.05 → round(20/1.05) = 19 ticks = 0.95 s

     Class rule (V3, README "Silahsız gövdeler"): a Brawler carries no weapon,
     the hands are the weapon. Both fists wear a wrap torn from the unit's own
     material. Archetype `punch`: both arms strike, the rear one crossing at 58%.
     The front fist's leading edge rests at x 120 (`WEAPON` borek [119, 87]).

     Redrawn for ticket 15 against docs/style-bible.md. Mass = the slice,
     Dough's one rectangle: x 22..82 (60 wide), y 44..116 (72 tall), ratio
     1.20, with the browned top crust as the crown (y 36). Two laminations
     above the brows and the cut face below carry the "layers" read; the red
     sash moved from mid-body to the hem because the cast's eye band sits
     where it used to be. Eye y 84 = 56% of the mass. Materials 3 / fills 6:
     crust C98A3C A96E2A F3E3C0 · cloth B83A2E · leather 6E4A2A 4A3826 (the
     Dough batch's shared leather; its light value is not needed here). The
     shade is the right face of the slice, solid; one gleam (F3E3C0) on the crust top. Tint lines, none: the
     laminations are 5-wide bands of the crust light, not lines, and the fist
     wraps are cloth strips of the same value. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -22 212 194"
     class="rig" data-atk="punch" data-unit="borek" style="--dur-atk:0.95s">

  <ellipse class="shadow" cx="52" cy="137" rx="25" ry="6" fill="#2A2114" opacity=".32"/>

  <!-- Rear fist rests at x 18 so its ink stays inside the safe area (x ≥ 6). -->
  <g class="armB" style="transform-origin:30px 92px">
    <path d="M30 92 L20 95" stroke="#2A2114" stroke-width="12" stroke-linecap="round"/>
    <path d="M30 92 L20 95" stroke="#C98A3C" stroke-width="8" stroke-linecap="round"/>
    <path d="M24 99 L26 90" stroke="#F3E3C0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="18" cy="97" r="10" fill="#C98A3C" stroke="#2A2114" stroke-width="3"/>
    <path d="M13 91 L13 104 M18 90 L18 105" stroke="#F3E3C0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Legs and boots are the batch's shared construction (style bible §6):
       from y 104 to 126 off pivots x 44 / 62, soles flat on 136, boots 16 × 11. -->
  <g class="legB" style="transform-origin:44px 114px">
    <path d="M44 104 L41 126" stroke="#2A2114" stroke-width="14" stroke-linecap="round"/>
    <path d="M44 104 L41 126" stroke="#4A3826" stroke-width="10" stroke-linecap="round"/>
    <path d="M31 126 Q26 131 29 136 L44 136 Q46 130 42 125 Z"
          fill="#6E4A2A" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g class="legF" style="transform-origin:62px 114px">
    <path d="M62 104 L65 126" stroke="#2A2114" stroke-width="14" stroke-linecap="round"/>
    <path d="M62 104 L65 126" stroke="#4A3826" stroke-width="10" stroke-linecap="round"/>
    <path d="M63 125 Q60 130 62 136 L77 136 Q79 131 74 126 Z"
          fill="#6E4A2A" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g class="body">
    <!-- The slice: front face, its shaded right face, two laminations, then
         the browned top crust over the lot. -->
    <path d="M22 50 Q22 44 28 44 L76 44 Q82 44 82 50 L82 108 Q82 116 74 116 L30 116 Q22 116 22 108 Z"
          fill="#C98A3C" stroke="#2A2114" stroke-width="4" stroke-linejoin="round"/>
    <path d="M76 46 L82 50 L82 108 Q82 116 74 116 L74 110 Q77 110 77 106 L77 46 Z" fill="#A96E2A"/>
    <path d="M24 54 L80 54 M24 62 L80 62" stroke="#F3E3C0" stroke-width="5"/>
    <path d="M24 44 Q52 34 80 44 L82 50 L22 50 Z"
          fill="#A96E2A" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
    <path d="M30 42 Q40 38.5 50 38.5" fill="none" stroke="#F3E3C0" stroke-width="4" stroke-linecap="round"/>

    <!-- The cast face (style bible §5), eye y 84. -->
    <path d="M32 72 L44 74 M60 74 L72 72" stroke="#2A2114" stroke-width="3.4" stroke-linecap="round"/>
    <ellipse cx="39" cy="84" rx="6.6" ry="7.6" fill="#FFFFFF" stroke="#2A2114" stroke-width="2.3"/>
    <ellipse cx="65" cy="84" rx="6.6" ry="7.6" fill="#FFFFFF" stroke="#2A2114" stroke-width="2.3"/>
    <ellipse cx="40.4" cy="85" rx="3.6" ry="4.8" fill="#2A2114"/>
    <ellipse cx="66.4" cy="85" rx="3.6" ry="4.8" fill="#2A2114"/>
    <circle cx="38" cy="81.4" r="1.6" fill="#FFFFFF"/>
    <circle cx="64" cy="81.4" r="1.6" fill="#FFFFFF"/>
    <path d="M44 97 Q52 102 60 97" stroke="#2A2114" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- The Brawler's red sash, worn at the hem. -->
    <path d="M23 109 Q52 114 81 109" fill="none" stroke="#2A2114" stroke-width="8" stroke-linecap="round"/>
    <path d="M23 109 Q52 114 81 109" fill="none" stroke="#B83A2E" stroke-width="4.5" stroke-linecap="round"/>

    <g data-expression="cute">
      <path d="M32 74 Q38 69 44 74 M60 74 Q66 69 72 74" fill="none" stroke="#C98A3C" stroke-width="7" stroke-linecap="round"/>
      <path d="M32 74 Q38 69 44 74 M60 74 Q66 69 72 74" fill="none" stroke="#2A2114" stroke-width="2.8" stroke-linecap="round"/>
      <ellipse cx="31" cy="97" rx="3.2" ry="1.9" fill="#E48A76" opacity=".68"/><ellipse cx="73" cy="97" rx="3.2" ry="1.9" fill="#E48A76" opacity=".68"/>
      <path d="M44 96 Q52 104 60 96 Q59 107 52 108 Q45 107 44 96 Z" fill="#3B211C" stroke="#2A2114" stroke-width="2.3"/>
      <path d="M49 102 Q52 104 55 102" fill="none" stroke="#ED8A74" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <path class="crack" d="M34 54 L46 70 L36 86 L48 100 L38 112"
          stroke="#2A2114" stroke-width="3" fill="none" stroke-linejoin="round"/>
  </g>

  <g class="armF" style="transform-origin:74px 92px">
    <path d="M74 92 L98 89" stroke="#2A2114" stroke-width="16" stroke-linecap="round"/>
    <path d="M74 92 L98 89" stroke="#C98A3C" stroke-width="12" stroke-linecap="round"/>
    <path d="M86 95 L90 85 M92 95.5 L96 85.5" stroke="#F3E3C0" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="108" cy="87" r="12" fill="#C98A3C" stroke="#2A2114" stroke-width="3"/>
    <path d="M97 81 Q102 87 97 93" fill="none" stroke="#2A2114" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M103 77 L103 96 M110 76 L110 97" stroke="#F3E3C0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g class="fx" style="transform-origin:120px 87px">
    <path d="M120 74 L136 66 M124 87 L142 87 M120 100 L136 108"
          stroke="#F7DFA6" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <path d="M120 74 L131 69 M124 87 L137 87 M120 100 L131 105"
          stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="132" cy="78" r="2.6" fill="#F3E3C0"/>
    <circle cx="134" cy="98" r="2.2" fill="#F3E3C0"/>
  </g>
</svg>
