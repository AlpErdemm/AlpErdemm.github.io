<!-- Turşu · Küf 5 ✦ · Suikastçi · yakın dövüş
     attackSpeed 0.66 → round(20/0.66) = 30 tick = 1.50 sn

     Karakter sayfasına göre yeniden çizildi, ve BAŞLIK DA YANLIŞTI: "Koku 5 ✦"
     diyordu, oysa köken `units.ts`'te `kuf`. Koku, Küf'ün eski adı; rig o
     yeniden adlandırmayı hiç görmemiş.

     Silahı "kavanoz kapağı — kalkan gibi tutulur" idi ve gövde tombul bir
     turşuydu. Sayfa bambaşka bir şey istiyor: uzun, çökük, sıska bir şey —
     boynunda KIRIK KAVANOZ parçalarından bir kavuk, bir yanına yayılmış KÜF
     KOLONİLERİ, sürekli damlayan SALAMURA, ve iki KIRIK CAM BIÇAK.

     ARKETİP `swing` DEĞİL `stab`. Sayfanın şeridi dört kare: hazırlık, ŞİMŞEK
     HAMLESİ, çift cam kesik, GEÇİP GİDER — ve altında "en hızlı saldırı,
     hedefin içinden geçer". Baskın hareket yay değil atılış, `stab`in 16
     piksellik ileri ötelemesi de tam olarak o.

     Bıçaklar aşağı bakıyor (+28°), Mantı'yla aynı alçak gard ve aynı sebeple:
     `stab`in temas dönüşü küçük olduğu için `setAim` farkı kapatabiliyor.
     Kestane'nin `swing`i bunu yapamazdı — orada bıçak yukarı bakmak zorundaydı.

     SİLUET: kadronun tek SISKA ve ÇÖKÜK gövdesi. Küf'ün diğer ikisi yuvarlak;
     40 px'te bunu ayıran şey ince uzuvlar ve boyundaki cam taç. -->
