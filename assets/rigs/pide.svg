<!-- Pide · Hamur 3-star · frontline · melee · reference-aligned vector rework
     Reworked 2026-08-21 from repository art using the user-provided Pide concept.

     Reference translation: compact bread knight, split crust framing the face,
     filled center with sparse toppings, braided-dough armor, embroidered sash,
     round dough mace, heavy boots, and tall rope-edged wheat shield.

     Gameplay locks: viewBox, baseline, rig classes and pivots, data-atk="stab",
     one shield-driven attack, and contact coordinate (120,84). Flat primitives
     only; no filters, masks, gradients, text, or embedded raster imagery. -->
