<!-- Sirke · Küf 3 ✦ · Nişancı · menzil 3
     attackSpeed 1.11 → round(20/1.11) = 18 tick = 0.90 sn

     Karakter sayfasına göre yeniden çizildi. Eski rig "silah: kendi ağzı —
     ekşiyi püskürtüyor" diyordu; sayfa BASINÇLI PÜSKÜRTÜCÜ istiyor — cam
     hazneli metal namlu, arkaya dolanan yeşil hortum — ve şişeyi zırhlıyor:
     omuzlarda küf kolonileri, gövdede küf çiçekli tabard.

     ARKETİP `spray` OLARAK KALDI, ve bu sefer kalması doğru olan. Bu turdaki
     dört menzilli birimi (Simit, Mısır, Ayçiçeği, Çay) `stab`e taşıdım çünkü
     `throw` omuzlanmış bir namluyu savuruyordu. Burada öyle bir sorun yok:
     `spray` armF'i topu topu -9°/+11° kıpırdatıyor — bir püskürtücünün geri
     tepmesi kadar — ve `body`yi sıkıştırıp bırakıyor, ki basınçlı bir şişede
     tam olarak istenen şey o. Üstelik ammo pisti OLAN tek arketip: fıs 0.36'da
     ağızdan çıkıyor, 0.40'ta yok oluyor.

     Bu yüzden `.ammo` grubu DURUYOR ve `MUZZLE` onu `part: 'ammo'` ile
     okuyor — Domates'in ketçap damlasıyla aynı kurgu. Diğer dördünde grubu
     silmek zorunda kalmıştım, çünkü `stab`in ammo pisti yok.

     Menzilli boşluğun BEŞİNCİ tekrarı yine de vardı: `range: 3`, ama ne
     `MUZZLE` ne `SHOTS` satırı — atış göğsün ortasından çıkan krem bir
     noktaydı. `SHOTS` artık `spray` formunu kullanıyor; tabloda tanımlıydı ve
     Soğan'la Acı Sos çıkarıldığından beri hiçbir birim onu çağırmıyordu.

     KÜF ORTAK TABAN: cam + tüylü küf. KAP: UZUN İNCE ŞİŞE, turşunun şişkin
     kavanozundan ve peynirin tekerinden en-boy ile ayrılıyor. -->
