<!-- Kömür (Charcoal) · Burnt Oven · Spoil · melee, bare fists
     attackSpeed 0.83 -> round(20/0.83) = 24 ticks = 1.20 s

     Archetype `punch`, the one track that animates both arms: armF lands at
     36% and armB crosses at 58%, one blow and one damage number all the same.
     A body with no tool carries the Brawler convention, so `WEAPON komur
     [117, 88]` is the front knuckle rather than the far end of anything.

     Silhouette: the faceted boulder, and it is the only one of the five cut
     from straight lines. The Soot and the Smoke are curves, the Ember is a
     dome and the Clinker is a spire; this is the blunt block, which is what
     a 4-cost body standing in front of the others should be.

     No Origin, no Role, no team colour, no tier mark, and no
     `data-expression="cute"` group. Mass = the boulder, x 20..86 (66 wide),
     y 42..118 (76 tall), ratio 1.15. Eye y 84 = 55% of the mass. Materials 2
     / fills 6: char 454039 5E574E 322E29 * ember F2A02A D9541F B02E1F. One
     crescent (322E29, lower right), one lit facet (5E574E, upper left). Tint
     lines, two: the ember seams in the split faces. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -22 212 194"
     class="rig" data-atk="punch" data-unit="komur" style="--dur-atk:1.20s">

  <ellipse class="shadow" cx="52" cy="137" rx="28" ry="6" fill="#2A2114" opacity=".32"/>

  <g class="armB" style="transform-origin:30px 92px">
    <path d="M30 92 L22 96" stroke="#2A2114" stroke-width="12" stroke-linecap="round"/>
    <path d="M30 92 L22 96" stroke="#322E29" stroke-width="8" stroke-linecap="round"/>
    <circle cx="19" cy="98" r="10" fill="#454039" stroke="#2A2114" stroke-width="3"/>
    <path d="M14 92 L14 105 M19 91 L19 106" stroke="#5E574E" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g class="legB" style="transform-origin:44px 114px">
    <path d="M44 106 L41 124" stroke="#2A2114" stroke-width="14" stroke-linecap="round"/>
    <path d="M44 106 L41 124" stroke="#322E29" stroke-width="10" stroke-linecap="round"/>
    <path d="M31 124 Q26 129 29 134 L44 134 Q46 128 42 123 Z"
          fill="#454039" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g class="legF" style="transform-origin:62px 114px">
    <path d="M62 106 L65 124" stroke="#2A2114" stroke-width="14" stroke-linecap="round"/>
    <path d="M62 106 L65 124" stroke="#322E29" stroke-width="10" stroke-linecap="round"/>
    <path d="M63 123 Q60 128 62 134 L77 134 Q79 129 74 124 Z"
          fill="#454039" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g class="body">
    <!-- The boulder: fill, lit facet, crescent, seams, then the ink over the
         lot. Every edge is a straight line; there is not a curve on it. -->
    <path d="M52 42 L70 48 L82 62 L86 82 L80 102 L66 116 L44 118 L28 110 L20 92 L22 68 L34 50 Z"
          fill="#454039"/>
    <path d="M52 42 L34 50 L22 68 L32 76 L46 56 Z" fill="#5E574E"/>
    <path d="M86 82 L80 102 L66 116 L52 117 L52 111 L63 110 L74 98 L80 82 Z" fill="#322E29"/>
    <path d="M34 66 L46 74 L38 88 M64 104 L74 96" fill="none" stroke="#B02E1F"
          stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M52 42 L70 48 L82 62 L86 82 L80 102 L66 116 L44 118 L28 110 L20 92 L22 68 L34 50 Z"
          fill="none" stroke="#2A2114" stroke-width="4" stroke-linejoin="round"/>

    <path d="M32 70 L44 76 M60 76 L72 70" stroke="#2A2114" stroke-width="3.4" stroke-linecap="round"/>
    <ellipse cx="39" cy="84" rx="6.6" ry="7.6" fill="#D9541F" stroke="#2A2114" stroke-width="2.3"/>
    <ellipse cx="65" cy="84" rx="6.6" ry="7.6" fill="#D9541F" stroke="#2A2114" stroke-width="2.3"/>
    <ellipse cx="40.4" cy="85" rx="3.6" ry="4.8" fill="#2A2114"/>
    <ellipse cx="66.4" cy="85" rx="3.6" ry="4.8" fill="#2A2114"/>
    <circle cx="38" cy="81.4" r="1.6" fill="#F2A02A"/>
    <circle cx="64" cy="81.4" r="1.6" fill="#F2A02A"/>
    <path d="M44 99 Q52 94 60 99" stroke="#2A2114" stroke-width="3" fill="none" stroke-linecap="round"/>

    <path class="crack" d="M34 54 L48 68 L38 84 L50 98 L40 112"
          stroke="#2A2114" stroke-width="3" fill="none" stroke-linejoin="round"/>
  </g>

  <g class="armF" style="transform-origin:76px 92px">
    <path d="M76 92 L94 89" stroke="#2A2114" stroke-width="16" stroke-linecap="round"/>
    <path d="M76 92 L94 89" stroke="#454039" stroke-width="12" stroke-linecap="round"/>
    <circle cx="104" cy="88" r="12" fill="#454039" stroke="#2A2114" stroke-width="3"/>
    <path d="M93 82 Q98 88 93 94" fill="none" stroke="#2A2114" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M99 78 L99 97 M106 77 L106 98" stroke="#5E574E" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g class="fx" style="transform-origin:118px 88px">
    <path d="M118 74 L136 66 M122 88 L142 88 M118 102 L136 111"
          stroke="#B02E1F" stroke-width="5.5" stroke-linecap="round" opacity=".9"/>
    <path d="M118 74 L130 69 M122 88 L136 88 M118 102 L130 108"
          stroke="#F2A02A" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="134" cy="77" r="2.8" fill="#D9541F"/>
    <circle cx="136" cy="100" r="2.4" fill="#5E574E"/>
  </g>
</svg>
