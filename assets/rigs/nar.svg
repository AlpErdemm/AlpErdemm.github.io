<!-- Nar · Pazar 5 ✦ · Nişancı · menzil 4
     attackSpeed 0.83 → round(20/0.83) = 24 tick = 1.20 sn

     Başlık da yanlıştı, sanat da. Eski başlık "Şerbet 4 ✦ ... menzil 4 · tek
     hedef · attackSpeed 0.95 → 21 tick" diyordu; `units.ts` Pazar 5 diyor,
     0.83 diyor, ve `skills.ts` hedefin BİTİŞİĞİNDEKİLERE de vuruyor, yani tek
     hedef değil. Süre (stildeki dur-atk 1.20s = 24 tick) tesadüfen doğruydu.

     Silah sapandı; sayfa TANE TOPU istiyor — pirinç kuşaklı ahşap namlu,
     üstünde tane dolu cam hazne, ağzı kızıl. Zırh, altın bandolier, pazar
     pelerini ve altın kese de sayfadan.

     ARKETİP `throw` DEĞİL `stab`, Simit/Mısır/Ayçiçeği ile aynı gerekçe:
     omuzlanmış bir namlu -56°/+38° savrulmaz, geri teper.

     `.ammo` grubu KALDIRILDI ve `MUZZLE` `part: 'ammo'`dan `part: 'armF'`e
     geçti. Elde tutulan bir avuç yoktu artık — tane namludan çıkıyor, ve
     `stab`in ammo pisti olmadığı için grup kalsaydı avuç namlunun ucunda
     asılı kalırdı. `SHOTS` zaten `flakes`: bir avuç tane, tek mermi değil. -->
