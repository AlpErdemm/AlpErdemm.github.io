     class="rig" data-atk="stab" data-unit="manti" style="--dur-atk:1.45s">

  <ellipse id="manti-shadow" class="shadow" cx="52" cy="137" rx="36" ry="6.2"
           fill="#160F0C" opacity=".34"/>

