<!-- Mantı · Hamur 4 ✦ · Suikastçi · yakın dövüş
     Production rebuild: compact twin-blade dumpling assassin.

     ART DIRECTION
     A broad cream dumpling crown sits over a deep-red scarf wedge. The paired
     knives form the lower diagonals, creating a readable diamond silhouette at
     64 px. Friendly eyes and a tiny embroidered smile preserve the roster's
     cute facial language without losing the low, ready assassin stance.

     RIG CONTRACT
     armB owns the rear knife; armF owns the forward knife. The authored front
     tip remains at 119,116 for UnitRig.WEAPON aiming. All static ink stays in
     x 6..124 / y 8..136, the shared board-safe art band. -->
