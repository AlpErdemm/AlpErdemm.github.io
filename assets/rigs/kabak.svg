<!-- Kabak · Bostan 2 ✦ · Öncü · yakın dövüş
     attackSpeed 1.11 → round(20/1.11) = 18 tick = 0.90 sn

     Karakter sayfasına göre yeniden çizildi. Eski rig turuncu düz bir küre ve
     "sapının kütüğü" adında kısa bir sopaydı; sayfa bir Öncü istiyor: kıvrık
     saplı balkabağı, yaprak yakalık, samana sarılı gövde, yaprak amblemli
     mavi korkuluk kumaşı ve BAHÇE KAPI KALKANI.

     ARKETİP `swing` DEĞİL `stab`, Pide'yle aynı gerekçe: sayfanın şeridi
     kalkanla omuzlama gösteriyor, ve `swing` armF'i 98 derece çevirip kalkanı
     savururdu. `stab` kolu 16px ileri itip 6° döndürüyor.

     Kalkan armF'te, saman balyası armB'de: ortak pist armB'yi ters yöne
     döndürdüğü için kalkan ileri giderken omuz geri kuruluyor.

     PİDE'DEN AYRIM. İkisi de kalkanlı Öncü ve ikisi de `stab`. Ayıran şey
     oran ve kalkanın kendisi: Pide dik ve dar bir üçgen, kalkanı düz tahta
     levha; Kabak bodur ve geniş bir küre, kalkanı aralıklı parmaklıklı bir
     bahçe kapısı, üstünde halka tokmak. 40 px'te ikisini ayıran şey bu. -->
