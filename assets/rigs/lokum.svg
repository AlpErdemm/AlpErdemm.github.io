    <ellipse cx="46" cy="73" rx="7.4" ry="8.4" fill="#fff" stroke="#2A2114" stroke-width="2.5"/>
    <ellipse cx="65" cy="73" rx="7.4" ry="8.4" fill="#fff" stroke="#2A2114" stroke-width="2.5"/>
    <ellipse cx="47.4" cy="74" rx="4.1" ry="5.3" fill="#2A2114"/>
