<!-- Zeytin · Pazar 2 ✦ · Suikastçi · yakın dövüş
     attackSpeed 0.88 → round(20/0.88) = 23 tick = 1.15 sn

     Karakter sayfasına göre yeniden çizildi. Eski rig silahı "çekirdeği —
     küçük, sert, sivri" diyordu ve eli boştu; sayfa TERAZİ BIÇAKLARI istiyor:
     altın boyunduruktan zincirle sarkan, alt kenarı çelik ağız olmuş iki
     terazi kefesi. Yanında altın kese, defter, pazar şalı ve fidan.

     ARKETİP `stab` OLARAK KALDI, ve bu sefer kalması bir karar. Kestane,
     Bamya ve Kahve'yi sayfaları biçtirdiği için `swing`e taşıdım; burada
     taşıyamam. `swing` temasta +56° ekliyor, ve zincirden sarkan bir kefe
     yukarı bakamaz — yerçekimi öyle çizdirmiyor. Aşağı asılı bir ağız
     `swing`de temasta +96°'ye gider, `setAim`in düzeltmek için isteyeceği
     -109° de AIM_MAX 95'in dışında kalır. `stab` ile kefe hafif önde durur
     (-6°), temas +0°, nişan -13°: hedefin gövdesiyle aynı hiza.

     Sayfanın üçüncü karesindeki kırmızı yayı `fx` taşıyor, gövde değil.

     PAZAR ORTAK TABAN korundu: pirinç ve sikke. Kadronun en KOYU gövdesi;
     Karpuz'un devasa yeşiliyle ve Nar'ın kırmızısıyla karışmıyor. -->
