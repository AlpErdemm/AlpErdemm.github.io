<!-- Camasir Suyu (Bleach) - Bleached Sink - Spoil - the Stop x20 wall
     attackSpeed 0.78 -> round(20/0.78) = 26 ticks = 1.30 s

     Archetype `swing`, and slowest cycle in the family. The verb is what
     makes this a wall rather than a large statline: what it bleaches loses
     its Origin rider and the bonus its items were paying for.

     `WEAPON camasirsuyu [119, 48]` is the held bottle's shoulder, resting
     high, which `swing`'s +56 at contact brings level.

     Silhouette: the shouldered bottle. A capped neck over sloped shoulders
     over straight sides - the only closed vessel in the Sink and the only
     body in it carrying a colour that is not grey, blue or green. The cap is
     on the wall deliberately: the one thing the player must recognise on
     sight at 53 px is the body that will take their carry apart.

     Mass x 28..76, y 18..118. Materials 2 / fills 4: bottle 97A199 D6DCD4
     F4F7F2 * cap A8B84A. Brass eye F2C46A. One label, one gleam (upper
     left). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -22 212 194"
     class="rig" data-atk="swing" data-unit="camasirsuyu" style="--dur-atk:1.30s">

  <ellipse class="shadow" cx="52" cy="137" rx="22" ry="6" fill="#2A2114" opacity=".32"/>

  <g class="armB" style="transform-origin:30px 84px">
    <path d="M30 84 L22 90" stroke="#2A2114" stroke-width="12" stroke-linecap="round"/>
    <path d="M30 84 L22 90" stroke="#97A199" stroke-width="8" stroke-linecap="round"/>
    <circle cx="19" cy="93" r="6.5" fill="#D6DCD4" stroke="#2A2114" stroke-width="3"/>
  </g>
  <g class="legB" style="transform-origin:44px 114px">
    <path d="M44 108 L41 124" stroke="#2A2114" stroke-width="14" stroke-linecap="round"/>
    <path d="M44 108 L41 124" stroke="#97A199" stroke-width="10" stroke-linecap="round"/>
    <path d="M31 124 Q26 129 29 134 L44 134 Q46 128 42 123 Z"
          fill="#D6DCD4" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g class="legF" style="transform-origin:62px 114px">
    <path d="M62 108 L65 124" stroke="#2A2114" stroke-width="14" stroke-linecap="round"/>
    <path d="M62 108 L65 124" stroke="#97A199" stroke-width="10" stroke-linecap="round"/>
    <path d="M63 123 Q60 128 62 134 L77 134 Q79 129 74 124 Z"
          fill="#D6DCD4" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g class="body">
    <!-- The cap and the neck, before the body, so the body covers the
         neck's seat. The cap is the one colour in the Sink that is not a
         grey, a blue or a green, and it is on the wall on purpose. -->
    <path d="M42 20 L62 20 L62 32 L42 32 Z" fill="#A8B84A" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
    <path d="M45 30 L59 30 L59 48 L45 48 Z" fill="#D6DCD4" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>

    <!-- The bottle: fill, crescent, the label, a gleam, then the ink. Sloped
         shoulders over straight sides - a closed vessel, which is what tells
         it from the open pipe beside it. -->
    <path d="M30 108 L30 66 Q32 50 44 44 L60 44 Q72 50 74 66 L74 108 Q74 118 62 118 L42 118 Q30 118 30 108 Z" fill="#D6DCD4"/>
    <path d="M74 66 L74 108 Q74 118 62 118 L52 118 L52 112 L62 112 Q68 112 68 106 L68 66 Q66 54 58 48 Q72 52 74 66 Z" fill="#97A199"/>
    <path d="M34 98 L70 98 L70 110 L34 110 Z" fill="#F4F7F2" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
    <path d="M40 104 L64 104" fill="none" stroke="#97A199" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M38 58 L36 78" fill="none" stroke="#F4F7F2" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M30 108 L30 66 Q32 50 44 44 L60 44 Q72 50 74 66 L74 108 Q74 118 62 118 L42 118 Q30 118 30 108 Z" fill="none" stroke="#2A2114" stroke-width="4" stroke-linejoin="round"/>

    <path d="M34 66 L46 68 M58 68 L70 66" stroke="#2A2114" stroke-width="3.4" stroke-linecap="round"/>
    <ellipse cx="41" cy="78" rx="5.6" ry="6.44" fill="#F2C46A" stroke="#2A2114" stroke-width="2.3"/>
    <ellipse cx="63" cy="78" rx="5.6" ry="6.44" fill="#F2C46A" stroke="#2A2114" stroke-width="2.3"/>
    <ellipse cx="42.4" cy="79" rx="3.05" ry="4.07" fill="#2A2114"/>
    <ellipse cx="64.4" cy="79" rx="3.05" ry="4.07" fill="#2A2114"/>
    <circle cx="40" cy="75.4" r="1.6" fill="#FFFFFF"/>
    <circle cx="62" cy="75.4" r="1.6" fill="#FFFFFF"/>
    <path d="M46 91 Q52 95 58 91" stroke="#2A2114" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path class="crack" d="M38 54 L50 68 L40 82 L52 96 L42 112"
          stroke="#2A2114" stroke-width="3" fill="none" stroke-linejoin="round"/>
  </g>
  <g class="armF" style="transform-origin:78px 84px">
    <path d="M78 84 L96 80" stroke="#2A2114" stroke-width="18" stroke-linecap="round"/>
    <path d="M78 84 L96 80" stroke="#D6DCD4" stroke-width="14" stroke-linecap="round"/>
    <!-- A second bottle, held by the neck. -->
    <!-- A second bottle, held by the neck and brought down. Its shoulder is
         the aim, resting high so `swing`'s contact lands it level. -->
    <path d="M98 70 Q108 48 119 46 Q120 60 110 82 Z"
          fill="#F4F7F2" stroke="#2A2114" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M112 50 Q118 48 119 46 Q120 52 116 56 Z" fill="#A8B84A" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g class="fx" style="transform-origin:119px 60px">
    <path d="M119 48 L137 38 M123 60 L141 60 M119 72 L137 82"
          stroke="#D6DCD4" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <path d="M119 48 L131 43 M123 60 L135 60 M119 72 L131 77"
          stroke="#F4F7F2" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="135" cy="42" r="2.6" fill="#D6DCD4"/>
    <circle cx="137" cy="76" r="2.4" fill="#F4F7F2"/>
  </g>
</svg>
