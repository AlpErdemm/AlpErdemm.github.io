<!-- Kopuk (Foam) - Bleached Sink - Spoil - melee, bare fists
     attackSpeed 1.20 -> round(20/1.20) = 17 ticks = 0.85 s

     Archetype `punch`, the family's cheapest body and it carries nothing, so
     the two fists are the whole of what it has. Fastest cycle in the Sink.

     `WEAPON kopuk [114, 90]` is the front knuckle, the Brawler convention.

     Silhouette: the cluster. A round froth with three loose bubbles riding off
     the crown at three different sizes, so the outline breaks upward in a way
     nothing else in the Sink does. It is round where the Sponge is squared and
     open where the Grime is a closed smear.

     No Origin, no Role, no team colour, no tier mark, and no
     `data-expression="cute"` group. Mass x 14..90, y 27..118. Materials 2 /
     fills 4: foam 7A8B8E C8D6DC F2F7F9 * brass eye F2C46A. Three cells drawn
     as rings, one gleam (upper left), one crescent (lower right). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -22 212 194"
     class="rig" data-atk="punch" data-unit="kopuk" style="--dur-atk:0.85s">

  <ellipse class="shadow" cx="52" cy="137" rx="30" ry="6" fill="#2A2114" opacity=".32"/>

  <g class="armB" style="transform-origin:30px 92px">
    <path d="M30 92 L22 98" stroke="#2A2114" stroke-width="12" stroke-linecap="round"/>
    <path d="M30 92 L22 98" stroke="#7A8B8E" stroke-width="8" stroke-linecap="round"/>
    <circle cx="19" cy="101" r="6.5" fill="#C8D6DC" stroke="#2A2114" stroke-width="3"/>
  </g>
  <g class="legB" style="transform-origin:44px 114px">
    <path d="M44 108 L41 124" stroke="#2A2114" stroke-width="14" stroke-linecap="round"/>
    <path d="M44 108 L41 124" stroke="#7A8B8E" stroke-width="10" stroke-linecap="round"/>
    <path d="M31 124 Q26 129 29 134 L44 134 Q46 128 42 123 Z"
          fill="#C8D6DC" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g class="legF" style="transform-origin:62px 114px">
    <path d="M62 108 L65 124" stroke="#2A2114" stroke-width="14" stroke-linecap="round"/>
    <path d="M62 108 L65 124" stroke="#7A8B8E" stroke-width="10" stroke-linecap="round"/>
    <path d="M63 123 Q60 128 62 134 L77 134 Q79 129 74 124 Z"
          fill="#C8D6DC" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g class="body">
    <!-- Two bubbles lifting off the crown before the mass, so the foam covers
         where they part from it. Different sizes on purpose: a matched pair
         reads as eyes at 53 px. -->
    <circle cx="34" cy="40" r="13" fill="#F2F7F9" stroke="#2A2114" stroke-width="3"/>
    <circle cx="68" cy="36" r="9" fill="#C8D6DC" stroke="#2A2114" stroke-width="3"/>
    <circle cx="82" cy="50" r="6" fill="#F2F7F9" stroke="#2A2114" stroke-width="3"/>

    <!-- The froth: fill, crescent, the cells, a gleam, then the ink over the lot. -->
    <path d="M20 92 Q14 68 38 60 Q50 46 66 58 Q90 62 86 90 Q90 118 66 118 L38 118 Q16 118 20 92 Z" fill="#C8D6DC"/>
    <path d="M86 90 Q90 118 66 118 L52 118 L52 112 L66 112 Q82 112 80 90 Z" fill="#7A8B8E"/>
    <circle cx="30" cy="74" r="5" fill="none" stroke="#7A8B8E" stroke-width="2.6"/>
    <circle cx="74" cy="80" r="4" fill="none" stroke="#7A8B8E" stroke-width="2.6"/>
    <circle cx="58" cy="108" r="4.4" fill="none" stroke="#7A8B8E" stroke-width="2.6"/>
    <path d="M30 66 Q24 78 28 90" fill="none" stroke="#F2F7F9" stroke-width="5" stroke-linecap="round"/>
    <path d="M20 92 Q14 68 38 60 Q50 46 66 58 Q90 62 86 90 Q90 118 66 118 L38 118 Q16 118 20 92 Z" fill="none" stroke="#2A2114" stroke-width="4" stroke-linejoin="round"/>

    <path d="M34 74 L46 76 M58 76 L70 74" stroke="#2A2114" stroke-width="3.4" stroke-linecap="round"/>
    <ellipse cx="41" cy="86" rx="6.2" ry="7.13" fill="#F2C46A" stroke="#2A2114" stroke-width="2.3"/>
    <ellipse cx="63" cy="86" rx="6.2" ry="7.13" fill="#F2C46A" stroke="#2A2114" stroke-width="2.3"/>
    <ellipse cx="42.4" cy="87" rx="3.38" ry="4.51" fill="#2A2114"/>
    <ellipse cx="64.4" cy="87" rx="3.38" ry="4.51" fill="#2A2114"/>
    <circle cx="40" cy="83.4" r="1.6" fill="#FFFFFF"/>
    <circle cx="62" cy="83.4" r="1.6" fill="#FFFFFF"/>
    <path d="M46 99 Q52 103 58 99" stroke="#2A2114" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path class="crack" d="M38 58 L50 72 L40 86 L52 100 L42 116"
          stroke="#2A2114" stroke-width="3" fill="none" stroke-linejoin="round"/>
  </g>
  <g class="armF" style="transform-origin:78px 92px">
    <path d="M78 92 L96 90" stroke="#2A2114" stroke-width="16" stroke-linecap="round"/>
    <path d="M78 92 L96 90" stroke="#C8D6DC" stroke-width="12" stroke-linecap="round"/>
    <circle cx="104" cy="90" r="10" fill="#C8D6DC" stroke="#2A2114" stroke-width="3"/>
    <path d="M100 82 Q104 90 100 98" fill="none" stroke="#2A2114" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="106" cy="86" r="2.2" fill="#7A8B8E"/>
  </g>

  <g class="fx" style="transform-origin:117px 90px">
    <path d="M117 78 L135 68 M121 90 L139 90 M117 102 L135 112"
          stroke="#C8D6DC" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <path d="M117 78 L129 73 M121 90 L133 90 M117 102 L129 107"
          stroke="#F2F7F9" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="133" cy="72" r="2.6" fill="#C8D6DC"/>
    <circle cx="135" cy="106" r="2.4" fill="#F2F7F9"/>
  </g>
</svg>
