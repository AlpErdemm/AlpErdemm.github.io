<!-- Patlıcan · Bostan 4 ✦ · Dövüşçü · yakın dövüş
     attackSpeed 1.11 → round(20/1.11) = 18 tick = 0.90 sn

     SINIF KURALI: silah yok. Sargı ASMA FİLİZİ — bostanın kendi ipi.

     BOSTAN ORTAK TABANI korundu: aşağıda toprak ve sap, yukarıda tamamen
     başka bir taç. Ayçiçeği'nin diski, Bamya'nın sivri yeşili, Kabak'ın
     küresi — Patlıcan'ınki aşağı çekilmiş bir ÇANAK YAPRAK, kaskı gibi
     gözlerinin üstünde duruyor.

     SİLUET: bostanın tek MOR gövdesi ve en uzun damlası. 40 px'te renk tek
     başına ayırıyor; sınıfın diğer beşi de sıcak tonlarda, bu tek soğuk. -->
