<!-- Sac (Griddle) · Burnt Oven · Spoil · melee, the plate itself
     attackSpeed 0.82 -> round(20/0.82) = 24 ticks = 1.20 s

     Archetype `crank`, shared with Kurum, and it is the one track whose name
     is literally what this body does: a sac is turned. The arm winds the
     plate through its own face and the contact comes off the rim, so
     `WEAPON sac [116, 57]` is the far rim rather than the hand that turns it,
     and it rests steeper than Kurum's rod at 62 degrees: a flat rest would
     put the rim inside the body at contact.

     Silhouette: the disc. A plain round plate, face on, with a raised rim
     drawn as a second ring inside the outline and a lug standing out at each
     side. It is the only circle on the whole roster that is a ring rather
     than a mass, and the two lugs break the outline at the widest point,
     which is what tells it from Kavruk's mound at 53 px. The one cool colour
     in the family as well: blued iron against nine bodies of char, ash and
     resin, so the two tools read as tools.

     No Origin, no Role, no team colour, no tier mark, and no
     `data-expression="cute"` group. Mass = the plate, x 18..86 (68 wide),
     y 44..118 (74 tall), ratio 1.09. No crown. Eye y 84 = 54% of the mass.
     Materials 2 / fills 5: iron 4A5058 767E88 2E3238 * ember D9541F F2A02A.
     One crescent (2E3238, lower right), one gleam (767E88, upper left). Tint
     lines, two: the rim ring, and the heat still in the plate's lower
     edge. The heat line sits low on purpose: laid across the crown it read
     as a headband at 53 px, the same trap the Burnt Loaf's scoring fell into,
     and only the board strip showed it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -22 212 194"
     class="rig" data-atk="crank" data-unit="sac" style="--dur-atk:1.20s">

  <ellipse class="shadow" cx="52" cy="137" rx="29" ry="6" fill="#2A2114" opacity=".32"/>

  <g class="armB" style="transform-origin:28px 94px">
    <path d="M28 94 L20 100" stroke="#2A2114" stroke-width="12" stroke-linecap="round"/>
    <path d="M28 94 L20 100" stroke="#2E3238" stroke-width="8" stroke-linecap="round"/>
    <circle cx="17" cy="103" r="6.5" fill="#4A5058" stroke="#2A2114" stroke-width="3"/>
  </g>

  <g class="legB" style="transform-origin:44px 114px">
    <path d="M44 108 L41 124" stroke="#2A2114" stroke-width="14" stroke-linecap="round"/>
    <path d="M44 108 L41 124" stroke="#2E3238" stroke-width="10" stroke-linecap="round"/>
    <path d="M31 124 Q26 129 29 134 L44 134 Q46 128 42 123 Z"
          fill="#4A5058" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g class="legF" style="transform-origin:62px 114px">
    <path d="M62 108 L65 124" stroke="#2A2114" stroke-width="14" stroke-linecap="round"/>
    <path d="M62 108 L65 124" stroke="#2E3238" stroke-width="10" stroke-linecap="round"/>
    <path d="M63 123 Q60 128 62 134 L77 134 Q79 129 74 124 Z"
          fill="#4A5058" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g class="body">
    <!-- The two lugs first, so the plate covers where they are riveted on.
         They sit at the widest point of the disc and are not a matched pair:
         the near one is longer, because a matched pair either side of x 52
         reads as ears. -->
    <path d="M26 74 L13 68 L13 82 L26 88 Z"
          fill="#2E3238" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
    <path d="M78 76 L89 72 L89 84 L78 86 Z"
          fill="#4A5058" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>

    <!-- The plate: fill, crescent, rim ring, heat bloom, gleam, then the ink. -->
    <ellipse cx="52" cy="81" rx="34" ry="37" fill="#4A5058"/>
    <path d="M86 81 A34 37 0 0 1 52 118 L52 112 A28 31 0 0 0 80 81 Z" fill="#2E3238"/>
    <ellipse cx="52" cy="81" rx="26" ry="29" fill="none" stroke="#2E3238" stroke-width="2.2"/>
    <path d="M34 108 Q52 116 70 108" fill="none" stroke="#D9541F" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M30 62 Q24 72 24 84" fill="none" stroke="#767E88" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="52" cy="81" rx="34" ry="37" fill="none" stroke="#2A2114" stroke-width="4"/>

    <path d="M32 72 L44 74 M60 74 L72 72" stroke="#2A2114" stroke-width="3.4" stroke-linecap="round"/>
    <ellipse cx="39" cy="84" rx="6.6" ry="7.6" fill="#F2A02A" stroke="#2A2114" stroke-width="2.3"/>
    <ellipse cx="65" cy="84" rx="6.6" ry="7.6" fill="#F2A02A" stroke="#2A2114" stroke-width="2.3"/>
    <ellipse cx="40.4" cy="85" rx="3.6" ry="4.8" fill="#2A2114"/>
    <ellipse cx="66.4" cy="85" rx="3.6" ry="4.8" fill="#2A2114"/>
    <circle cx="38" cy="81.4" r="1.6" fill="#FFFFFF"/>
    <circle cx="64" cy="81.4" r="1.6" fill="#FFFFFF"/>
    <path d="M44 97 Q52 102 60 97" stroke="#2A2114" stroke-width="3" fill="none" stroke-linecap="round"/>

    <path class="crack" d="M36 54 L48 68 L38 82 L50 96 L40 110"
          stroke="#2A2114" stroke-width="3" fill="none" stroke-linejoin="round"/>
  </g>

  <!-- The turning arm, and the crank handle it winds the plate with. -->
  <g class="armF" style="transform-origin:76px 94px">
    <path d="M76 94 L90 88" stroke="#2A2114" stroke-width="12" stroke-linecap="round"/>
    <path d="M76 94 L90 88" stroke="#2E3238" stroke-width="8" stroke-linecap="round"/>
    <circle cx="93" cy="86" r="6.5" fill="#4A5058" stroke="#2A2114" stroke-width="3"/>
    <path d="M93 86 L107 64" stroke="#2A2114" stroke-width="9" stroke-linecap="round"/>
    <path d="M93 86 L107 64" stroke="#767E88" stroke-width="5" stroke-linecap="round"/>
    <path d="M103 66 L113 52 L119 59 L109 72 Z"
          fill="#4A5058" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
    <path d="M106 60 L114 64" stroke="#D9541F" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <g class="fx" style="transform-origin:116px 59px">
    <path d="M118 48 L136 40 M122 60 L142 60 M118 74 L136 82"
          stroke="#D9541F" stroke-width="5.5" stroke-linecap="round" opacity=".9"/>
    <path d="M118 48 L130 43 M122 60 L136 60 M118 74 L130 79"
          stroke="#F2A02A" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="134" cy="51" r="2.8" fill="#767E88"/>
    <circle cx="136" cy="72" r="2.4" fill="#D9541F"/>
  </g>
</svg>
