    <path d="M63 125 Q60 130 62 134 L79 134 Q81 130 75 126 Z"
          fill="#6B4426" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g class="body">
    <!-- The loaf: fill, crescent, scoring, gleam, then the ink over the lot.
         The outline is a run of lobes rather than one curve, and the crown is
         notched down to y 68: it shares the roster's dome with Kör, and a
         smooth dome drawn twice is one body drawn twice. -->
    <path d="M52 44 Q64 42 70 50 Q80 50 84 60 Q90 68 88 80 Q90 92 84 102 Q84 114 72 118 Q62 122 52 119 Q42 122 32 118 Q20 114 20 102 Q14 92 16 80 Q14 68 20 60 Q24 50 34 50 Q40 42 52 44 Z" fill="#6B4426"/>
    <path d="M88 80 Q90 92 84 102 Q84 114 72 118 Q62 122 52 119 L52 113
             Q62 115 70 111 Q79 107 79 98 Q84 90 82 80 Z" fill="#3E2716"/>
    <path d="M24 92 L34 86 M70 96 L80 90" fill="none" stroke="#3E2716"
          stroke-width="2.2" stroke-linecap="round"/>
    <path d="M28 62 Q22 72 22 84" fill="none" stroke="#9A6A3C" stroke-width="5" stroke-linecap="round"/>
    <path d="M52 44 Q64 42 70 50 Q80 50 84 60 Q90 68 88 80 Q90 92 84 102 Q84 114 72 118 Q62 122 52 119 Q42 122 32 118 Q20 114 20 102 Q14 92 16 80 Q14 68 20 60 Q24 50 34 50 Q40 42 52 44 Z"
          fill="none" stroke="#2A2114" stroke-width="4" stroke-linejoin="round"/>

    <!-- The scoring, and it is the whole tell. Three diagonal cuts across the
         crown, split open to the fire: an ink trough with the ember standing
         in it, flat, no glow. Diagonal and uneven on purpose — drawn as one
         band across the crown it read as a headband at 53 px, and drawn as a
         wedge standing out of the crown it read as a candle. Neither is
         visible in a number; both were visible in the board strip, which is
         what the strip is for. -->
    <path d="M28 66 L44 52 M40 72 L58 56 M56 72 L72 58" fill="none" stroke="#2A2114"
          stroke-width="8" stroke-linecap="round"/>
    <path d="M28 66 L44 52 M40 72 L58 56 M56 72 L72 58" fill="none" stroke="#B02E1F"
          stroke-width="4.5" stroke-linecap="round"/>
    <path d="M31 64 L42 54 M42 70 L56 58 M58 70 L69 60" fill="none" stroke="#F2A02A"
          stroke-width="1.8" stroke-linecap="round"/>

    <path d="M32 76 L44 78 M60 78 L72 76" stroke="#2A2114" stroke-width="3.4" stroke-linecap="round"/>
    <ellipse cx="39" cy="88" rx="6.6" ry="7.6" fill="#D9541F" stroke="#2A2114" stroke-width="2.3"/>
    <ellipse cx="65" cy="88" rx="6.6" ry="7.6" fill="#D9541F" stroke="#2A2114" stroke-width="2.3"/>
