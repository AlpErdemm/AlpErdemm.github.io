<!-- Yanık Somun (Burnt Loaf) · Burnt Oven · Spoil · the Region boss
     attackSpeed 0.78 -> round(20/0.78) = 26 ticks = 1.30 s

     Archetype `punch`, the slowest cycle on the whole roster at 1.30 s. Both
     arms land, one blow, one damage number. `WEAPON yaniksomun [112, 94]` is
     the front knuckle, set lower and further in than any other Brawler's
     because the mass is the widest thing the family owns and the arm is short
     against it.

     Silhouette: the scored loaf. A broad crust dome, lobed rather than smooth
     along its outline, with three diagonal baker's cuts laid across the crown
     and split open to the fire. It shares the roster's dome with Kör and is
     told from it by exactly two things: the cuts, and the colour. Where the
     Ember is a stone with fire standing on top of it, this is bread that was
     scored and then left in.

     **Why the two bosses do not read as one bigger and one biggest.** Kavruk
     is angular, spread along the floor, and split down to open ember seams;
     this is round, tall, closed everywhere except the one slash across its
     crown, and it is the only warm-brown boss against the Scorch's char. One
     is a rock that never went out. The other is a thing that was baked too
     long and came out of the oven anyway.

     No Origin, no Role, no team colour, no tier mark, and no
     `data-expression="cute"` group. Mass = the loaf, x 16..88 (72 wide),
     y 42..120 (78 tall), ratio 1.08. No crown item.
     Eye y 88 = 59% of the mass. Materials 2 / fills 6: crust 6B4426 9A6A3C
     3E2716 * ember F2A02A D9541F B02E1F. One crescent (3E2716, lower right),
     one gleam (9A6A3C, upper left). Tint lines, two: the scoring on the
     flanks. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -22 212 194"
     class="rig" data-atk="punch" data-unit="yaniksomun" style="--dur-atk:1.30s">

  <ellipse class="shadow" cx="52" cy="137" rx="30" ry="6" fill="#2A2114" opacity=".32"/>

  <g class="armB" style="transform-origin:28px 98px">
    <path d="M28 98 L21 102" stroke="#2A2114" stroke-width="14" stroke-linecap="round"/>
    <path d="M28 98 L21 102" stroke="#3E2716" stroke-width="10" stroke-linecap="round"/>
    <circle cx="19" cy="104" r="10" fill="#6B4426" stroke="#2A2114" stroke-width="3"/>
    <path d="M14 98 L14 111 M19 97 L19 112" stroke="#3E2716" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g class="legB" style="transform-origin:44px 114px">
    <path d="M44 114 L41 126" stroke="#2A2114" stroke-width="15" stroke-linecap="round"/>
    <path d="M44 114 L41 126" stroke="#3E2716" stroke-width="11" stroke-linecap="round"/>
    <path d="M30 126 Q25 130 28 134 L45 134 Q47 129 43 125 Z"
          fill="#6B4426" stroke="#2A2114" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g class="legF" style="transform-origin:62px 114px">
    <path d="M62 114 L65 126" stroke="#2A2114" stroke-width="15" stroke-linecap="round"/>
