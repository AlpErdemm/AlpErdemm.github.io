    <path d="M42 101 Q52 108 62 101" stroke="#2A2114" stroke-width="3" fill="none" stroke-linecap="round"/>

    <path class="crack" d="M34 60 L48 74 L36 90 L50 104 L38 118"
          stroke="#2A2114" stroke-width="3" fill="none" stroke-linejoin="round"/>
  </g>

  <g class="armF" style="transform-origin:78px 98px">
