    <path d="M78 98 L92 96" stroke="#6B4426" stroke-width="13" stroke-linecap="round"/>
    <circle cx="100" cy="95" r="12" fill="#6B4426" stroke="#2A2114" stroke-width="3"/>
    <path d="M90 89 Q95 95 90 101" fill="none" stroke="#2A2114" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M96 85 L96 104 M103 84 L103 105" stroke="#3E2716" stroke-width="3" stroke-linecap="round"/>
