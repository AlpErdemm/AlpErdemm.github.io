  <g class="fx" style="transform-origin:114px 95px">
    <path d="M114 80 L134 70 M118 95 L142 95 M114 110 L134 120"
          stroke="#B02E1F" stroke-width="6.5" stroke-linecap="round" opacity=".9"/>
    <path d="M114 80 L127 74 M118 95 L136 95 M114 110 L127 116"
          stroke="#F2A02A" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="134" cy="82" r="3.2" fill="#D9541F"/>
    <circle cx="136" cy="108" r="2.8" fill="#9A6A3C"/>
  </g>
</svg>
