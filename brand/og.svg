    <!-- İKİNCİ HÂL: kavrulmuş koçan. `rigLoader`'ın `cooked` parçası — motorda
         `opacity 0` başlar, `trait:ocak` olayında beş tikte açılır ve bir daha
         kapanmaz (`UnitRig.cook`). Kartlarda hiç görünmez (`rigSource.chipSvg`).

         YÜZE VE ÖNLÜĞE DOKUNULMUYOR, ve bu bir kural: bu katman `body`'nin
         ÜSTÜNE çiziliyor, yani buraya konan her şey altındakini siler. Gözler
         birimin kimliği — ham da olsa pişmiş de olsa Mısır Mısır'dır — ve
         kırmızı önlük 40 px'te siluetin yarısı. Kavrulan şey koçanın kendisi:
         tepe kabuğu, patlamış taneler, kabarmış boşluklar, ve kenarlardan
         çıkan köz.

         `transform-origin` koçanın ortasında (52,66), gövdenin tabanında
         değil: açılışın %18'lik taşması oradan patlıyor, ayaklardan değil. -->
